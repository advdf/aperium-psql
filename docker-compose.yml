services:
  aperium:
    build: .
    image: aperium-psql:latest
    container_name: aperium-psql
    ports:
      - "8088:8080"
    volumes:
      - ./data:/data
      # SSH private keys: optional staging area. The operator drops a key
      # file here, picks it via the bastions UI; on save the SERVER reads
      # the file content and pushes it to the KMS as `privateKeyRef`.
      # The key file itself can then be deleted from the host. See
      # docs/kms.md for the migration path from path-based bastions.
      - ./keys:/keys:ro
      # Read-only mount of the openbao-state volume so we can resolve
      # OPENBAO_TOKEN_FILE without ever putting the token in env vars.
      - openbao-state:/openbao/state:ro
    environment:
      - APERIUM_DATA_DIR=/data
      - PORT=8080
      - TZ=${TZ:-UTC}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=aperium
      # PG_PASSWORD is unset by default so the server falls back to the
      # well-known KMS ref `openbao:server/pg-password`. The
      # `openbao-bootstrap` one-shot below seeds that ref from POSTGRES_PASSWORD
      # before aperium starts. Override here only when seeding manually (e.g.
      # against a self-hosted KMS) — set to a ref or to a one-time literal.
      - PG_PASSWORD=${PG_PASSWORD:-}
      - PG_DATABASE=aperium
      # SESSION_SECRET unset = use the well-known ref. If the ref is missing
      # the server auto-seeds 32 random bytes on first boot. Set this to a
      # literal value to bootstrap a chosen secret (auto-pushed to the KMS
      # with a warning to clear the env var on the next boot).
      - SESSION_SECRET=${SESSION_SECRET:-}
      - APERIUM_KMS=${APERIUM_KMS:-openbao}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      # The OpenBao container writes its dynamically-generated root token
      # to /openbao/state/root-token on first boot. Aperium reads that
      # path via OPENBAO_TOKEN_FILE rather than carrying the token in env
      # (so `docker inspect aperium-psql` shows no token at all).
      - OPENBAO_TOKEN_FILE=/openbao/state/root-token
      - OPENBAO_MOUNT=${OPENBAO_MOUNT:-secret}
      # Set to 'true' when serving over HTTPS so the session cookie is
      # marked Secure. Leave unset for plain-HTTP localhost dev.
      - COOKIE_SECURE=${COOKIE_SECURE:-}
      # When behind a reverse proxy (nginx/caddy), set to the number of
      # proxy hops (e.g. 1) so req.ip and the rate limiter see the real
      # client. See express docs for IP/CIDR forms.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # One-shot migration: copy any pre-existing /data/{connections,
      # snippets,bastions}.json into the directory of the user whose email
      # matches this value, on their next register or login. Leave unset
      # if you don't have legacy single-user files to import.
      - APERIUM_MIGRATE_TO_EMAIL=${APERIUM_MIGRATE_TO_EMAIL:-}
    networks:
      - public
      - internal
    depends_on:
      postgres:
        condition: service_started
      bastion:
        condition: service_started
      openbao-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  bastion:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: aperium-bastion
    ports:
      - "2222:2222"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-UTC}
      - USER_NAME=jump
      - PASSWORD_ACCESS=false
      - PUBLIC_KEY_FILE=/keys/bastion_key.pub
    volumes:
      - ./scripts/bastion_key.pub:/keys/bastion_key.pub:ro
      - ./scripts/bastion-init:/custom-cont-init.d:ro
    networks:
      - public
      - internal
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: aperium-postgres
    # No `ports:` — postgres is only reachable from the `internal` network (i.e.
    # via the bastion). Swap to `"5433:5432"` on `public` if you want to connect
    # directly from the host.
    environment:
      - POSTGRES_USER=aperium
      # The postgres image needs the password in plaintext on FIRST init to
      # set up pg_hba.conf. Subsequent boots ignore it (auth lives in the
      # data volume). Aperium itself reads PG_PASSWORD from the KMS.
      - POSTGRES_PASSWORD=aperium
      - POSTGRES_DB=aperium
    volumes:
      - ./data/pg:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    networks:
      - internal
    restart: unless-stopped

  # One-shot bootstrap: seeds the well-known boot-secret refs into OpenBao
  # before aperium starts. Idempotent — values that already exist are left
  # alone. Reads the dynamically-generated root token written by the
  # openbao init script to the shared `openbao-state` volume.
  openbao-bootstrap:
    image: openbao/openbao:latest
    container_name: aperium-openbao-bootstrap
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      - BAO_ADDR=http://openbao:8200
      - PG_PASSWORD_SEED=aperium
    volumes:
      - openbao-state:/openbao/state:ro
    entrypoint:
      - sh
      - -c
      - 'export BAO_TOKEN=$$(cat /openbao/state/root-token); if bao kv get -mount=secret aperium/server/pg-password > /dev/null 2>&1; then echo "[bootstrap] openbao:server/pg-password already present, skipping"; else bao kv put -mount=secret aperium/server/pg-password value="$$PG_PASSWORD_SEED" > /dev/null && echo "[bootstrap] seeded openbao:server/pg-password"; fi'
    command: []
    networks:
      - internal
    restart: "no"

  # OpenBao with persistent file storage and auto-init/unseal. The unseal
  # key + root token live on the openbao-state volume — fine for a dev
  # install, NOT for production (see docs/kms.md). The init.sh wrapper
  # script handles first-boot init and every-boot unseal so the container
  # survives `docker compose down/up` without manual intervention.
  openbao:
    image: openbao/openbao:latest
    container_name: aperium-openbao
    entrypoint:
      - /bin/sh
      - /openbao/scripts/init.sh
    environment:
      # The CLI talks to the local server over plain HTTP — used by the
      # init script AND by the docker healthcheck below.
      - BAO_ADDR=http://127.0.0.1:8200
    volumes:
      - openbao-data:/openbao/data
      - openbao-state:/openbao/state
      - ./scripts/openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./scripts/openbao/init.sh:/openbao/scripts/init.sh:ro
    cap_add:
      - IPC_LOCK
    healthcheck:
      # Healthy only when initialized AND unsealed. `bao status` exits 0 on
      # unsealed, 2 on sealed; we treat both 0 and "successfully parsed
      # output" as proceeding, but the init script guarantees unseal on
      # every boot, so `exit code 0` is the canonical green state.
      test: ["CMD-SHELL", "bao status > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 8s
    networks:
      - internal
    restart: unless-stopped

networks:
  public:
  internal:
    internal: true

volumes:
  # OpenBao file-storage backend. Survives `docker compose down`. Wipe
  # with `docker volume rm aperium-psql_openbao-data` to start fresh.
  openbao-data:
  # Holds the init.json (unseal key + root token) and the
  # /openbao/state/root-token file consumed by aperium and the
  # bootstrap container. Same lifecycle as openbao-data.
  openbao-state:
